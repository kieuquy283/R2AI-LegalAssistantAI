  # =========================

  - id: "luatvietnam_business_law_search_luat_doanh_nghiep"
    name: "LuatVietnam - Tìm kiếm Luật Doanh nghiệp"
    provider: "LuatVietnam"
    source_type: "search_page"
    domain: "business_law"
    subdomains:
      - "company_establishment"
      - "capital_contribution"
      - "company_governance"
      - "legal_representative"
      - "enterprise_registration"
