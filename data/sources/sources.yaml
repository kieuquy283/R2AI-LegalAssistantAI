# R2AI Legal AI Assistant
# Source Registry for Data Ingestion
#
# Purpose:
# - Manage all legal document sources in one place.
# - Support offline crawling, domain-aware routing, and reproducible indexing.
# - Each source must have a stable id, domain, URL, crawl strategy, and legal scope.
#
# Notes:
# - Do not crawl live during evaluation.
# - Use these sources only for offline ingestion.
# - Respect robots.txt, rate limits, login/paywall restrictions, and source terms.

version: "1.0"

default_policy:
  crawl_mode: "offline"
  respect_robots_txt: true
  allow_login_required: false
  allow_paywall_bypass: false
  allow_captcha_bypass: false
  default_rate_limit_seconds: 2
  default_retry: 2
  default_timeout_seconds: 60

allowed_domains:
  - business_law
  - investment_law
  - tax_law
  - labor_law
  - social_insurance
  - administrative_penalty
  - civil_commercial_law
  - accounting_law
  - ip_law
  - trade_law
  - customs_law
  - construction_law
  - transportation_law
  - education_law
  - health_law
  - banking_law
  - securities_law
  - environment_law
  - procurement_law
  - land_law

