    enabled: true
    priority: "high"
    crawl_frequency: "weekly"
    crawl_strategy:
      collect_document_links: true
      link_pattern: "-d1.html"
      detail_page_required: true
      download_files: false
      prefer_html_content: true
      pagination:
        enabled: true
        strategy: "detect_or_manual"
        max_pages: 20
    extraction:
      output_formats:
        - "raw_html"
        - "markdown"
      metadata_fields:
