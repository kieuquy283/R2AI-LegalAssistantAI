        - "doc_number"
        - "doc_type"
        - "issuing_body"
        - "issue_date"
        - "effective_date"
        - "status"
        - "source_url"
    legal_scope:
      include_keywords:
        - "Luật Doanh nghiệp"
        - "doanh nghiệp"
        - "công ty"
        - "vốn điều lệ"
        - "người đại diện theo pháp luật"
        - "đăng ký doanh nghiệp"
      exclude_keywords:
        - "tin tức"
        - "bình luận"
        - "dịch vụ tư vấn"
    compliance:
      public_content_only: true
      no_login: true
      no_paywall_bypass: true
      citation_required: true

